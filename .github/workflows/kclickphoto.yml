name: Update ISD Service Marketing KClickPhoto

on:
  push:
    branches:
      - kclickphoto

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy isd_marketing to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.KCLICKPHOTO_HOST }}
        username: ${{ secrets.KCLICKPHOTO_USERNAME }}
        key: ${{ secrets.KCLICKPHOTO_SSH_KEY }}
        script_stop: true
        script: |
          # Clone if not exists, otherwise update
          if [ ! -d /home/odoo/addons-system/isd_marketing ]; then
            sudo -u odoo git clone git@github-odoo:IntelliSync-data/isd_marketing.git /home/odoo/addons-system/isd_marketing
            cd /home/odoo/addons-system/isd_marketing && git checkout kclickphoto
          else
            cd /home/odoo/addons-system/isd_marketing
            sudo -u odoo git fetch origin && sudo -u odoo git reset --hard origin/kclickphoto
          fi

          # Sync isd_marketing directory with rsync (including deletions)
          sudo mkdir -p /opt/custom-addons/isd_marketing
          sudo rsync -av --delete \
            --exclude='views/menu_items_override.xml.*' \
            --exclude='__manifest__.py.*' \
            /home/odoo/addons-system/isd_marketing/ /opt/custom-addons/isd_marketing/

    - name: Update isd_marketing Module
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.KCLICKPHOTO_HOST }}
        username: ${{ secrets.KCLICKPHOTO_USERNAME }}
        key: ${{ secrets.KCLICKPHOTO_SSH_KEY }}
        script: |
          echo "Updating apps list..."
          echo "env['ir.module.module'].update_list(); env.cr.commit()" | sudo -u odoo /odoo-venv/bin/python /odoo18/odoo-bin shell -c /odoo.conf -d ${{ secrets.KCLICKPHOTO_DB_NAME }} --no-http
          echo "Updating isd_marketing module..."
          sudo -u odoo /odoo-venv/bin/python /odoo18/odoo-bin -c /odoo.conf -d ${{ secrets.KCLICKPHOTO_DB_NAME }} -u isd_marketing --stop-after-init --no-http || \
            echo "Module not installed yet (now visible in Apps list), continuing..."

    - name: Restart Odoo Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.KCLICKPHOTO_HOST }}
        username: ${{ secrets.KCLICKPHOTO_USERNAME }}
        key: ${{ secrets.KCLICKPHOTO_SSH_KEY }}
        script: |
          sudo systemctl restart odoo

    - name: Verify Odoo Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.KCLICKPHOTO_HOST }}
        username: ${{ secrets.KCLICKPHOTO_USERNAME }}
        key: ${{ secrets.KCLICKPHOTO_SSH_KEY }}
        script: |
          sleep 5
          if sudo systemctl is-active --quiet odoo; then
            echo "Odoo restarted successfully"
          else
            echo "Odoo failed to restart"
            echo "=== systemctl status ==="
            sudo systemctl status odoo --no-pager
            echo "=== Last 50 lines of Odoo log ==="
            sudo tail -n 50 /var/log/odoo/odoo.log
            exit 1
          fi